# Default values for SkyOps Helm chart.
# SkyOps is a self-hosted, Kubernetes-native incident management and observability platform.

# ==============================================================================
# 1. SkyOps Control Plane Configuration
# ==============================================================================
replicaCount: 1

image:
  repository: ghcr.io/skyops/skyops
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

# Persistent storage for SkyOps Control Plane data and bootstrap security artifacts
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: "/app/.data"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

env:
  DEPLOYMENT_MODE: "self-hosted"
  DATA_TELEMETRY_ENABLED: "false"
  APP_URL: ""

# Cryptographic secrets configuration
# If existingSecret is not provided and values are empty, secure CSPRNG secrets will be generated automatically.
secrets:
  existingSecret: ""
  JWT_SECRET: ""
  SESSION_SECRET: ""
  INTERNAL_ENCRYPTION_KEY: ""
  LICENSE_SIGNING_SECRET: ""
  AGENT_REGISTRATION_TOKEN: ""
  DATABASE_URL: ""
  GEMINI_API_KEY: ""

# ==============================================================================
# 2. In-Cluster PostgreSQL (StatefulSet)
# ==============================================================================
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: skyops
    database: skyops
    password: "" # auto-generated if left empty
    existingSecret: ""
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    allowPrivilegeEscalation: false

# ==============================================================================
# 3. In-Cluster SkyOps Agent (Auto-monitors the local cluster)
# ==============================================================================
agent:
  enabled: true
  replicaCount: 1
  clusterName: "in-cluster"
  image:
    repository: ghcr.io/skyops/agent
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  rbac:
    create: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ==============================================================================
# 4. Ingress Configuration (Optional)
# ==============================================================================
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: skyops.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Node scheduling
nodeSelector: {}
tolerations: []
affinity: {}
