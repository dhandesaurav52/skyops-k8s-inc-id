{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skyops.secretName" . }}
  labels:
    {{- include "skyops.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | default (randAlphaNum 32) | quote }}
  SESSION_SECRET: {{ .Values.secrets.SESSION_SECRET | default (randAlphaNum 32) | quote }}
  INTERNAL_ENCRYPTION_KEY: {{ .Values.secrets.INTERNAL_ENCRYPTION_KEY | default (randAlphaNum 32) | quote }}
  LICENSE_SIGNING_SECRET: {{ .Values.secrets.LICENSE_SIGNING_SECRET | default (randAlphaNum 32) | quote }}
  AGENT_REGISTRATION_TOKEN: {{ .Values.secrets.AGENT_REGISTRATION_TOKEN | default (randAlphaNum 32) | quote }}
  {{- $dbPassword := .Values.postgresql.auth.password | default (randAlphaNum 24) }}
  DATABASE_PASSWORD: {{ $dbPassword | quote }}
  {{- if .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  {{- else if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgresql.auth.username $dbPassword (include "skyops.postgresqlFullname" .) .Values.postgresql.auth.database | quote }}
  {{- end }}
  {{- if .Values.secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | quote }}
  {{- end }}
{{- end }}
