{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skyops.fullname" . | default "skyops" }}-secrets
  labels:
    app.kubernetes.io/name: skyops
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # If values are not explicitly supplied, Helm auto-generates secure random secrets
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | default (randAlphaNum 32) | quote }}
  LICENSE_SIGNING_SECRET: {{ .Values.secrets.LICENSE_SIGNING_SECRET | default (randAlphaNum 32) | quote }}
  {{- if .Values.secrets.INITIAL_ADMIN_PASSWORD }}
  INITIAL_ADMIN_PASSWORD: {{ .Values.secrets.INITIAL_ADMIN_PASSWORD | quote }}
  {{- end }}
  {{- if .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  {{- else if .Values.postgresql.enabled }}
  DATABASE_URL: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
  {{- end }}
  {{- if .Values.secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | quote }}
  {{- end }}
{{- end }}
