apiVersion: v1
kind: Service
metadata:
  name: {{ include "skyops.fullname" . }}
  labels:
    {{- include "skyops.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 3000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "skyops.selectorLabels" . | nindent 4 }}
