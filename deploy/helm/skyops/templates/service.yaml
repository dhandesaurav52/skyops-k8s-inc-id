apiVersion: v1
kind: Service
metadata:
  name: skyops
  labels:
    app.kubernetes.io/name: skyops
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: skyops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: skyops-config
data:
  NODE_ENV: "production"
  DEPLOYMENT_MODE: {{ .Values.env.DEPLOYMENT_MODE | quote }}
  DATA_TELEMETRY_ENABLED: {{ .Values.env.DATA_TELEMETRY_ENABLED | quote }}
  INITIAL_ADMIN_EMAIL: {{ .Values.env.INITIAL_ADMIN_EMAIL | quote }}
  APP_URL: {{ .Values.env.APP_URL | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: skyops-secrets
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  INITIAL_ADMIN_PASSWORD: {{ .Values.secrets.INITIAL_ADMIN_PASSWORD | quote }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  LICENSE_SIGNING_SECRET: {{ .Values.secrets.LICENSE_SIGNING_SECRET | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.GEMINI_API_KEY | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skyops-sa
