# SkyOps Agent Values Configuration

server:
  url: "https://api.skyops.example.com"

cluster:
  name: "production"

agent:
  token: ""
  image:
    repository: dhandesaurav52/skyops-agent
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

serviceAccount:
  create: true
  name: skyops-agent-sa

nodeSelector: {}
tolerations: []
affinity: {}
